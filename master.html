<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#23465b">
<title>베어링 구매 관리</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--p:#23465b;--bg:#f2f4f6;--line:#d6dde3;--muted:#667583;--ink:#1c2530;
 --gA:#a7382d;--gB:#a34d0b;--gC:#2f6a8a;--gD:#667583;--ok:#1b7f4b}
*{box-sizing:border-box}
.hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #9cb9cf;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:10px 12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:18px}
.chip{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:14px;min-height:38px;text-decoration:none;display:inline-flex;align-items:center}
.sub{font-size:12px;opacity:.85;margin:6px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 -4px}
.tab{position:relative;background:transparent;border:0;border-bottom:4px solid transparent;color:#fff;padding:6px 2px 7px;opacity:.72;line-height:1.2}
.tab b{display:block;font-size:19px}
.tab span{display:block;font-size:11px}
.tab i{position:absolute;top:2px;right:4px;font-style:normal;font-size:11px;font-weight:700;min-width:19px;padding:1px 5px;border-radius:10px;background:#fff;color:var(--p)}
.tab i.alert{background:#ff6b5b;color:#fff}
.tab.on{opacity:1;border-bottom-color:#fff}
main{max-width:720px;margin:0 auto;padding:10px 12px}
.intro{font-size:13px;color:#33404d;line-height:1.5;margin:2px 2px 10px}
#q{width:100%;padding:12px;font-size:16px;border:2px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.note{background:#fff3ce;border:1px solid #e8cd85;color:#6b4d0f;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gD);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.card.gA{border-left-color:var(--gA)}.card.gB{border-left-color:var(--gB)}.card.gC{border-left-color:var(--gC)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.stock{flex:0 0 auto;min-width:54px;text-align:center;border-radius:9px;padding:5px 8px;font-size:19px;font-weight:700;background:#fff0ed;color:var(--gA)}
.stock.warn{background:#fff0da;color:var(--gB)}
.stock small{display:block;font-size:10px;font-weight:500}
.meta{font-size:13px;margin:7px 0 2px;color:#33404d}
.meta b{font-size:14px}
.req{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff3ce;border:1px solid #e8cd85;border-radius:8px;padding:6px 9px;margin-top:8px;font-size:14px;font-weight:700;color:#6b4d0f}
.req.buy{background:#e1eef6;border-color:#a9cbe0;color:#1f4d68}
.act{display:flex;align-items:center;gap:7px;margin-top:9px}
.stepper{display:flex;align-items:center;flex:0 0 auto;border:2px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:42px;border:0;background:#f2f4f6;font-size:22px;color:#33404d}
.stepper input{width:46px;height:42px;border:0;text-align:center;font-size:17px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btn{flex:1;min-height:44px;border-radius:9px;font-size:15px;font-weight:700;border:2px solid var(--p);background:#fff;color:var(--p)}
.btn.buy{background:var(--p);color:#fff}
.btn:disabled{opacity:.45}
.mini{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #b9a25f;background:#fff;color:#6b4d0f;font-size:13px;font-weight:700}
.req.buy .mini{border-color:#7aa9c4;color:#1f4d68}
.empty{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.rule{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(20,37,54,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#fff;width:100%;max-width:380px;border-radius:14px;padding:20px 18px}
.panel h2{margin:0 0 6px;font-size:20px}
.panel input{width:100%;padding:13px;font-size:17px;border:2px solid var(--line);border-radius:10px;margin:10px 0 8px}
.err{color:var(--gA);font-size:14px;min-height:20px;margin-bottom:8px}
.panel .btn{width:100%;background:var(--p);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><b>📊 구매 관리</b><div class="row"><button id="refresh" class="chip">새로고침</button><a class="chip" href="./">출고 화면</a></div></div>
  <div id="sub" class="sub">불러오는 중…</div>
  <div id="tabs" class="tabs"></div>
</header>
<main>
  <div id="issueNote" class="note hidden"></div>
  <div id="intro" class="intro"></div>
  <input id="q" type="search" placeholder="번호·규격·위치로 찾기" autocomplete="off">
  <div id="list"></div>
  <div id="rule" class="rule"></div>
</main>

<div id="gate" class="overlay hidden">
  <div class="panel">
    <h2>마스터 PIN</h2>
    <div class="muted">구매 관리는 마스터 PIN으로만 열립니다.</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="마스터 PIN">
    <div id="gateErr" class="err"></div>
    <button id="gateOk" class="btn">확인</button>
    <div style="text-align:center;margin-top:12px"><a href="./" class="muted">← 출고 화면으로</a></div>
  </div>
</div>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxRHvicONvIlxnjTudbnfHnkSFSrq8eFGUXM9VEmPUWtTte7J5fA-LVKoFOZ8fdhuy9/exec';
const KEY = 'br_master_pin';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/[\s\-_.×*]/g, '');
const p2 = n => String(n).padStart(2, '0');
const lget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function fetchT(u, o = {}, ms = 25000) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(u, { ...o, signal: c.signal }).finally(() => clearTimeout(t)); }
const post = obj => fetchT(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) }).then(r => r.json());

const CATS = { B:'베어링', UB:'유니트베어링', IB:'인서트베어링', PB:'플러머블럭', UBH:'유니트베어링 하우징' };
const catName = code => { const m = /^([A-Za-z]+)-/.exec(code || ''); return m ? (CATS[m[1].toUpperCase()] || '') : ''; };
const TABS = [
  { g: 'A', t: '자주' }, { g: 'B', t: '보통' }, { g: 'C', t: '가끔' }, { g: 'D', t: '이력 없음' }, { g: 'R', t: '구매 목록' }
];

let pin = '', data = null, tab = 'A', q = '', loadedAt = 0, busy = false, tt;

// 출고 화면에서 이미 마스터 PIN으로 들어왔다면 그 PIN을 이어서 씁니다.
function initialPin() {
  const own = lget(KEY);
  if (own) return own;
  try { if (JSON.parse(lget('br_role') || 'null') === 'master') return JSON.parse(lget('br_pin') || '""') || ''; } catch (e) {}
  return '';
}
const myName = () => { try { return JSON.parse(lget('br_name') || '""') || '마스터'; } catch (e) { return '마스터'; } };

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function showGate(msg) { $('gateErr').textContent = msg || ''; $('gate').classList.remove('hidden'); setTimeout(() => $('pinIn').focus(), 50); }

async function load(manual) {
  if (!pin) { showGate(''); return; }
  if (busy) return;
  busy = true;
  try {
    const d = await post({ pin, action: 'master' });
    if (d.ok) {
      data = d; loadedAt = Date.now(); lset(KEY, pin);
      $('gate').classList.add('hidden');
      render();
      if (manual) toast('새로 불러왔습니다');
    } else if (d.error === 'PIN') { pin = ''; showGate('PIN이 맞지 않습니다.'); }
    else if (d.error === 'FORBIDDEN') { pin = ''; showGate('마스터 PIN이 아닙니다. (현장·관리자 PIN으로는 열 수 없습니다)'); }
    else toast(d.msg || '불러오지 못했습니다');
  } catch (e) {
    toast('인터넷 연결을 확인하세요' + (data ? ' (마지막으로 불러온 내용 표시 중)' : ''));
    if (!data) $('sub').textContent = '불러오지 못했습니다 · 새로고침을 눌러주세요';
  } finally { busy = false; }
}

function renderTabs() {
  const s = data.summary;
  $('tabs').innerHTML = TABS.map(x => {
    const n = x.g === 'R' ? data.requests.length : s[x.g].low;
    const alert = (x.g === 'A' && n > 0) ? ' alert' : '';
    return '<button class="tab' + (tab === x.g ? ' on' : '') + '" data-g="' + x.g + '"><b>' + (x.g === 'R' ? '🛒' : x.g) + '</b><span>' + x.t + '</span>' + (n > 0 ? '<i class="' + alert.trim() + '">' + n + '</i>' : '') + '</button>';
  }).join('');
}

function intro() {
  const st = data.settings, s = data.summary, y = st.years;
  if (tab === 'A') return `최근 ${y}년간 <b>${st.aMin}회 이상</b> 구매한 자주 쓰는 베어링 ${s.A.total}종 중, 재고가 ${st.aStock}개 이하인 ${s.A.low}종입니다. 가장 먼저 채워야 합니다.`;
  if (tab === 'B') return `최근 ${y}년간 <b>${st.bMin}~${st.aMin - 1}회</b> 구매한 베어링 ${s.B.total}종 중, 재고 ${st.bStock}개 이하 ${s.B.low}종입니다.`;
  if (tab === 'C') return `최근 ${y}년간 <b>${st.cMin}~${st.bMin - 1}회</b> 구매한 가끔 쓰는 베어링 ${s.C.total}종 중, 재고 ${st.cStock}개 이하 ${s.C.low}종입니다. 채우는 데 시간 여유가 있습니다.`;
  if (tab === 'D') return `최근 ${y}년간 구매 이력이 없는 베어링 ${s.D.total}종 중 재고가 없는 ${s.D.low}종입니다. 알림은 가지 않으며 참고용입니다.`;
  return '구매대기·구매 버튼으로 담아 둔 목록입니다. 입고가 기록되면 자동으로 사라집니다.';
}

function card(it) {
  const warn = it.k > 0 ? ' warn' : '';
  const cn = catName(it.c);
  const r = it.r;
  const qv = r ? r.q : it.q;
  return '<div class="card g' + it.g + '" data-c="' + esc(it.c) + '">' +
    '<div class="top"><div><div class="nm">' + esc(it.n) + '</div><div class="muted">' + (cn ? esc(cn) + ' · ' : '') + esc(it.c) + (it.s ? ' · ' + esc(it.s) : '') + (it.l ? ' · ' + esc(it.l) : '') + '</div></div>' +
    '<div class="stock' + warn + '">' + it.k + '<small>재고</small></div></div>' +
    '<div class="meta">최근 ' + data.settings.years + '년 구매 <b>' + it.cnt + '회</b> · ' + it.g + '등급</div>' +
    (r ? '<div class="req' + (r.st === '구매요청' ? ' buy' : '') + '"><span>' + esc(r.st) + ' · ' + esc(r.q) + '개</span><button class="mini" data-act="cancel" data-id="' + esc(r.id) + '">취소</button></div>' : '') +
    '<div class="act"><div class="stepper"><button data-act="dec" aria-label="수량 줄이기">−</button><input type="number" inputmode="numeric" min="1" value="' + esc(qv) + '" aria-label="수량"><button data-act="inc" aria-label="수량 늘리기">＋</button></div>' +
    '<button class="btn" data-act="wait">구매대기</button><button class="btn buy" data-act="buy">구매</button></div></div>';
}

function reqCard(r) {
  const cn = catName(r.c);
  return '<div class="card"><div class="top"><div><div class="nm">' + esc(r.n) + '</div><div class="muted">' + (cn ? esc(cn) + ' · ' : '') + esc(r.c) + '</div></div>' +
    '<div class="stock warn" style="background:#edf0f3;color:#283b49">' + esc(r.q) + '<small>개</small></div></div>' +
    '<div class="req' + (r.st === '구매요청' ? ' buy' : '') + '"><span>' + esc(r.st) + '</span><button class="mini" data-act="cancel" data-id="' + esc(r.id) + '">취소</button></div>' +
    '<div class="muted" style="margin-top:6px">' + esc(r.ts.slice(5, 16)) + ' · ' + esc(r.by) + (r.note ? ' · ' + esc(r.note) : '') + '</div></div>';
}

function render() {
  if (!data) return;
  const at = new Date(loadedAt);
  $('sub').textContent = p2(at.getHours()) + ':' + p2(at.getMinutes()) + ' 기준 · 등급은 최근 ' + data.settings.years + '년 구매횟수로 자동 계산';
  renderTabs();
  $('intro').innerHTML = intro();
  $('issueNote').classList.toggle('hidden', !(data.issues > 0));
  $('issueNote').textContent = '구매횟수 탭에 품목과 연결되지 않은 줄이 ' + data.issues + '개 있습니다. 구글 시트 메뉴 [베어링 관리 > 구매횟수 확인]을 실행해 E열을 확인하세요. 연결되지 않은 품목은 구매이력이 없는 D로 분류됩니다.';
  const kw = q.split(/\s+/).map(norm).filter(Boolean);
  const hit = it => kw.every(t => norm((it.c || '') + (it.n || '') + (it.s || '') + (it.l || '')).includes(t));
  let html;
  if (tab === 'R') {
    const rows = data.requests.filter(r => kw.every(t => norm(r.c + r.n).includes(t)));
    html = rows.length ? rows.map(reqCard).join('') : '<div class="empty">담아 둔 구매 요청이 없습니다.</div>';
  } else {
    const rows = data.lists[tab].filter(hit);
    html = rows.length ? rows.map(card).join('') : '<div class="empty">' + (q ? '일치하는 품목이 없습니다.' : tab === 'D' ? '재고가 없는 이력 없음 품목이 없습니다.' : '재고가 소진된 품목이 없습니다. 👍') + '</div>';
  }
  const y = window.scrollY;
  $('list').innerHTML = html;
  window.scrollTo(0, y);
  const st = data.settings;
  $('rule').textContent = `등급 기준(최근 ${st.years}년 구매횟수): A ${st.aMin}회 이상 · B ${st.bMin}~${st.aMin - 1}회 · C ${st.cMin}~${st.bMin - 1}회 · D 0회. 기준과 알림 재고는 시트의 [설정] 탭에서 바꿀 수 있습니다. 구매횟수는 과거 입력값에 앞으로 기록되는 입고 건수가 더해집니다.`;
}

// ---- 구매 요청 ----
function findItem(c) { for (const g of ['A', 'B', 'C', 'D']) { const it = data.lists[g].find(x => x.c === c); if (it) return it; } return null; }
async function addReq(card, mode) {
  const c = card.dataset.c, it = findItem(c);
  const qty = Number(card.querySelector('.stepper input').value);
  if (!Number.isSafeInteger(qty) || qty < 1 || qty > 100000) { toast('수량은 1 이상의 정수로 입력하세요'); return; }
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'add', mode, c, qty, by: myName() });
    if (d.ok) {
      const st = mode === 'buy' ? '구매요청' : '구매대기';
      const now = new Date(), ts = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':00';
      if (it) it.r = { id: d.id, st, q: qty };
      const i = data.requests.findIndex(r => r.id === d.id);
      const rec = { id: d.id, c, n: it ? it.n : c, q: qty, st, ts, by: myName(), note: '' };
      if (i >= 0) data.requests[i] = rec; else data.requests.unshift(rec);
      toast(mode === 'buy' ? '구매 요청을 기록했습니다' : '구매대기에 담았습니다');
      render();
    } else if (d.error === 'PIN' || d.error === 'FORBIDDEN') { pin = ''; showGate('PIN을 다시 입력해주세요.'); }
    else { toast(d.msg || '기록하지 못했습니다'); card.querySelectorAll('button').forEach(b => b.disabled = false); }
  } catch (e) { toast('인터넷 연결을 확인하세요'); card.querySelectorAll('button').forEach(b => b.disabled = false); }
}
async function cancelReq(id, btn) {
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'cancel', id });
    if (d.ok || d.error === 'CLOSED' || d.error === 'NOT_FOUND') {
      data.requests = data.requests.filter(r => r.id !== id);
      ['A', 'B', 'C', 'D'].forEach(g => data.lists[g].forEach(it => { if (it.r && it.r.id === id) it.r = null; }));
      toast(d.ok ? '취소했습니다' : (d.msg || '이미 처리된 요청입니다'));
      render();
    } else { toast(d.msg || '취소하지 못했습니다'); btn.disabled = false; }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}

// ---- 이벤트 ----
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.g; render(); window.scrollTo(0, 0); });
$('q').addEventListener('input', () => { q = $('q').value.trim(); render(); });
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, cardEl = b.closest('.card');
  if (act === 'cancel') { cancelReq(b.dataset.id, b); return; }
  const inp = cardEl.querySelector('.stepper input');
  if (act === 'dec') inp.value = Math.max(1, (Number(inp.value) || 1) - 1);
  else if (act === 'inc') inp.value = (Number(inp.value) || 0) + 1;
  else if (act === 'wait' || act === 'buy') addReq(cardEl, act);
});
$('list').addEventListener('focusin', e => { if (e.target.matches('.stepper input')) e.target.select(); });
$('refresh').onclick = () => load(true);
$('gateOk').onclick = () => { const v = $('pinIn').value.trim(); if (!v) { $('gateErr').textContent = 'PIN을 입력하세요.'; return; } pin = v; $('gateErr').textContent = ''; load(false); };
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('gateOk').click(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - loadedAt > 60000) load(false); });

pin = initialPin();
load(false);
</script>
</body>
</html>
